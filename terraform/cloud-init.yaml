#cloud-config

package_update: true

runcmd:
  - apt-get update -y

  - apt-get install -y ca-certificates curl gnupg git

  # Docker official repository
  - install -m 0755 -d /etc/apt/keyrings

  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc

  - chmod a+r /etc/apt/keyrings/docker.asc

  - bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'

  # Docker Engine + Compose
  - apt-get update -y

  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Docker without sudo for ubuntu
  - usermod -aG docker ubuntu

  # Docker service
  - systemctl enable docker

  - systemctl start docker

  # DFS Way repository
  - rm -rf /home/ubuntu/dfs-way

  - git clone https://github.com/daniloof/dfs-way.git /home/ubuntu/dfs-way

  - chown -R ubuntu:ubuntu /home/ubuntu/dfs-way